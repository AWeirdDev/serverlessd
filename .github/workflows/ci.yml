name: Release

on:
    release:
        types: [created]

permissions:
    contents: write

jobs:
    build-macos:
        name: Build macOS (${{ matrix.target }})
        runs-on: macos-latest
        strategy:
            matrix:
                include:
                    - target: aarch64-apple-darwin
                      suffix: -macos-aarch64
                    - target: x86_64-apple-darwin
                      suffix: -macos-x86_64

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Cache Cargo registry & build
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

            - name: Build
              run: |
                  cargo build --release --target ${{ matrix.target }}
                  cargo build --release --target ${{ matrix.target }} -p svld-binding-kv

            - name: Rename binaries
              run: |
                  cp target/${{ matrix.target }}/release/serverlessd serverlessd${{ matrix.suffix }}
                  cp target/${{ matrix.target }}/release/svld-binding-kv binding-kv${{ matrix.suffix }}

            - name: Upload binaries to release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      serverlessd${{ matrix.suffix }}
                      binding-kv${{ matrix.suffix }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build-linux:
        name: Build Linux (${{ matrix.target }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      suffix: -linux-x86_64
                    - target: aarch64-unknown-linux-gnu
                      suffix: -linux-aarch64

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install aarch64 cross-compiler
              if: matrix.target == 'aarch64-unknown-linux-gnu'
              run: sudo apt-get install -y gcc-aarch64-linux-gnu

            - name: Cache Cargo registry & build
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

            - name: Build
              run: |
                  cargo build --release --target ${{ matrix.target }}
                  cargo build --release --target ${{ matrix.target }} -p svld-binding-kv
              env:
                  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

            - name: Rename binaries
              run: |
                  cp target/${{ matrix.target }}/release/serverlessd serverlessd${{ matrix.suffix }}
                  cp target/${{ matrix.target }}/release/svld-binding-kv binding-kv${{ matrix.suffix }}

            - name: Upload binaries to release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      serverlessd${{ matrix.suffix }}
                      binding-kv${{ matrix.suffix }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build-docker:
        name: Trigger Docker Build
        needs: build-linux
        uses: ./.github/workflows/docker.yml
        with:
            tag_name: ${{ github.event.release.tag_name }}
        permissions:
            contents: read
            packages: write
