[package]
name = "svld-ipc-client"
description = "Implementation of the serverlessd bindings protocol with `serde` integration."
version = "0.1.0"
edition = "2024"

[dependencies]
bon = "3.9.1"
ijson = "0.1.6"
interprocess = { version = "2.4.2", features = ["tokio"] }
serde = "1.0.228"
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3" }
tracing = "0.1.44"
