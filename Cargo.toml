[package]
name = "serverlessd"
version = "0.1.2"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
salvo = { version = "0.91.1", features = ["affix-state"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.51.0", features = ["rt", "rt-multi-thread", "sync", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = "1.0.228"
tokio-util = { version = "0.7.18", features = ["rt"] }
dotenvy = "0.15.7"
async-trait = "0.1.89"
rand = "0.10.0"
askama = { version = "0.15.6", features = ["alloc", "derive"] }
bytes = "1.11.1"

# custom deps
svld-rt = { path = "./crates/svld-rt" }
svld-wrangler-config = { path = "./crates/svld-wrangler-config" }

[dev-dependencies]
# pnet = "0.35.0"

[workspace]
members = [
    "crates/svld-language",
    "crates/svld-rt",
    "crates/svld-ipc-client",

    "crates/svld-wrangler-config",

    # binaries
    "crates/svld-binding-kv",
]
